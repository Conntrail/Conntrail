    const tl = gsap.timeline({ paused: true });
    const input = document.getElementById("input");

    const arc = { dashoffset: 628.3 };
    const score = { v: 0 };

    function type(text, at, dur) {
      const typer = { n: 0 };

        n: text.length, duration: dur, ease: "none",
        onStart: function () { input.classList.remove("placeholder"); },
        onUpdate: function () { input.textContent = text.slice(0, Math.round(typer.n)); }

    function press(at) {
      tl.to("#send", { scale: 0.88, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, at);
    }

    tl.fromTo(".chat-window", { y: 30 }, { y: 0, duration: 0.5, ease: "expo.out" }, 0);
    tl.fromTo(".readout", { y: 30 }, { y: 0, duration: 0.5, ease: "expo.out" }, 0.08);

    type(msg1, 0.2, 1.35);
    press(1.55);
    tl.call(function () { input.textContent = "Message support…"; input.classList.add("placeholder"); }, null, 1.62);
    tl.fromTo("#msg1", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.66);

    tl.fromTo("#typing", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, 2.05);
    tl.to("#typing", { opacity: 0, duration: 0.15 }, 2.55);
    tl.fromTo("#reply1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3 }, 2.62);

    tl.fromTo("#typing", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, 4.62);
    tl.to("#typing", { opacity: 0, duration: 0.15 }, 5.05);
    tl.fromTo("#reply2", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3 }, 5.1);
    tl.fromTo("#chip2", { y: 6 }, { y: 0, duration: 0.25 }, 5.38);

    tl.to(arc, { dashoffset: 157.1, duration: 1.2, ease: "power2.inOut" }, 5.65);
    tl.to(score, {
      v: 0.75, duration: 1.2, ease: "power2.out",
      onUpdate: function () { document.getElementById("gauge-score").textContent = score.v.toFixed(2); }
    }, 5.65);
    tl.fromTo("#gauge-badge", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" }, 6.65);
    tl.fromTo("#row-neutral", { scale: 1 }, { scale: 1.02, duration: 0.22, yoyo: true, repeat: 1 }, 6.8);
    tl.fromTo("#row-opposite", { opacity: 0.7 }, { opacity: 1, duration: 0.25 }, 6.95);

    tl.to({}, { duration: 1.3 }, 8.2);

    // Loop reset: leave everything in a state that reads as the start again.
    tl.to("#msg2, #reply2", { opacity: 0, y: 10, duration: 0.35, ease: "power2.in" }, 9.3);
    tl.to(arc, { dashoffset: 628.3, duration: 0.5, ease: "power2.inOut" }, 9.5);
    tl.to(score, { v: 0, duration: 0.5, ease: "power2.inOut",
      onUpdate: function () { document.getElementById("gauge-score").textContent = score.v.toFixed(2); }
    }, 9.5);
    tl.to("#gauge-badge", { opacity: 0, duration: 0.2 }, 9.5);

    tl.set(["#msg1", "#msg2", "#reply1", "#reply2", "#cf"], { opacity: 0, x: 0, y: 0 }, 10.7);

    window.__timelines["loop"] = tl;
