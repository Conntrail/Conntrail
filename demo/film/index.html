<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f4f7fb;
        --ink: #10151d;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j7pz"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-7wq5"
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-jrd8"
        id="flip"
        data-composition-id="flip"
        data-composition-src="compositions/02-flip.html"
        data-start="8"
        data-duration="5"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-ymbd"
        id="gauge"
        data-composition-id="gauge"
        data-composition-src="compositions/03-gauge.html"
        data-start="13"
        data-duration="5"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-l4cz"
        id="proof"
        data-composition-id="proof"
        data-composition-src="compositions/04-proof.html"
        data-start="18"
        data-duration="6"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-ycva"
        id="claim"
        data-composition-id="claim"
        data-composition-src="compositions/05-claim.html"
        data-start="24"
        data-duration="6"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].seek(0);
    </script>
  </body>
</html>
