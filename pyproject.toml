[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conntrail"
version = "0.1.0"
description = "Standalone observability for agentic workflows — contrastive routing analysis, collector, and dashboard"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["observability", "llm", "agents", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dashboard = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.30.0",
]
gepa = [
    "dspy-ai>=2.5.0",
    "gepa>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conntrail", "src/conntrail_server", "src/conntrail_dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: requires live API keys",
    "slow: takes > 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
